name: IntelliJ Plugin Build

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/intellij-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/intellij-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Disk space before Gradle setup
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # IDE/verifier downloads can make a shared Gradle home cache exceed runner disk.
          cache-disabled: true

      - name: Disk space after Gradle setup
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build buildPlugin verifyPlugin --no-daemon

      - name: Disk space after build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$HOME"
          du -sh "$HOME/.gradle" "$GITHUB_WORKSPACE/.intellijPlatform" 2>/dev/null || true
