name: UI Integration

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/ui-integration.yml'
      - '.github/workflows/intellij-build.yml'
  schedule:
    - cron: '37 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-functional:
    name: Validate Functional (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Disk space before Gradle setup
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # IntelliJ sandbox downloads already fill most of the hosted runner.
          # Restoring the shared Gradle cache exhausted it before IDE startup.
          cache-disabled: true

      - name: Disk space after Gradle setup
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Run parser, build, and IntelliJ UI sandbox validation
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew validateFunctional --no-daemon --stacktrace --info

      - name: Disk space after functional validation
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$HOME"

      - name: Retain functional test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-diagnostics
          path: |
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            out/ide-tests/tests/**/idea.log
          if-no-files-found: warn
          retention-days: 14
