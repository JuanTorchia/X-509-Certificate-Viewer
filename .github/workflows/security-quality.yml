name: Security & Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  schedule:
    - cron: '24 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0

  gradle-quality:
    name: Gradle Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Resolve exact dependency inventory
        run: ./gradlew --init-script scripts/security/inventory.init.gradle securityInventory --no-daemon

      - name: Verify scanner contract and query OSV
        run: |
          python3 scripts/security/inventory_package.py
          python3 -m unittest discover -s scripts/security -p 'test_*.py'
          python3 scripts/security/scan_osv.py

      - name: Retain dependency security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resolved-dependency-security
          path: |
            build/security/*.json
            build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile for CodeQL
        run: |
          chmod +x gradlew
          ./gradlew compileKotlin compileTestKotlin --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@v4
