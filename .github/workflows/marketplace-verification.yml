name: Certificate IDE flows
on:
  workflow_dispatch:
    inputs:
      source:
        description: Artifact to exercise
        type: choice
        options: [published, candidate]
        default: published
      version:
        description: Exact public version (published mode only)
        default: '1.0.36'
        type: string
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/verification/**'
      - '.github/workflows/marketplace-verification.yml'
permissions:
  contents: read
jobs:
  ide-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CERTVIEW_PUBLISHED_SMOKE: '1'
      CERTVIEW_VERIFY_SOURCE: ${{ github.event_name == 'pull_request' && 'candidate' || inputs.source }}
      CERTVIEW_MARKETPLACE_VERSION: ${{ inputs.version || '1.0.36' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate disposable demo fixtures
        run: python3 scripts/verification/generate-marketplace-fixtures.py
      - name: Exercise selected artifact in actual IntelliJ2026.2.2
        run: |
          chmod +x gradlew
          xvfb-run --auto-servernum ./gradlew integrationTest --tests '*PublishedMarketplaceSmokeTest' verifyIdePluginLogs --no-daemon --stacktrace
      - name: Require actual executed flows and clean plugin logs
        run: python3 scripts/verification/verify-marketplace-evidence.py
      - name: Retain IDE logs and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: certificate-ide-evidence
          path: |
            build/marketplace-verification-receipt.json
            build/reports/tests/integrationTest/**
            build/test-results/integrationTest/**
            out/ide-tests/tests/**/idea.log
            out/ide-tests/tests/**/log/screenshots/**
          if-no-files-found: error
          retention-days: 14
